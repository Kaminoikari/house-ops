# house-ops Portal Configuration

title_filter:
  property_types:
    include: ["華廈", "大樓", "套房", "獨立套房"]
    exclude: ["公寓", "預售屋", "店面", "辦公室", "車位", "工業用", "雅房", "分租套房", "合租"]
  price:
    rent_max: 20000
    buy_max: 30000000
  size_min: 8

tracked_portals:
  - name: "591 租屋"
    type: rent
    enabled: true
    source: 591
    url_template: "https://rent.591.com.tw/list?region=3&section=26&shape=2,4,6&rentprice=0,{rent_max}&area={size_min},&kind=1,2"

  - name: "591 買屋"
    type: buy
    enabled: false
    source: 591
    url_template: "https://sale.591.com.tw/?region={region_code}&price=0,{buy_max}&area={size_min},"

  # 暫停 FB 社團爬蟲：抽到的 permalink 點進去常找不到對應貼文（FB DOM 變動 +
  # EXTRACT_JS 在抓不到真實 /posts/{id}/ 連結時 fallback 到 hash anchor 假連結）。
  # 待重新設計爬蟲機制後再開啟。
  - name: "FB 台北租屋社團"
    type: rent
    enabled: false
    source: facebook_group
    group_url: "https://www.facebook.com/groups/464870710346711/"
    group_id: "464870710346711"
    scroll_rounds: 20

market_reference:
  lvr_api:
    enabled: true
    use_for: price_comparison

search_queries:
  - name: "591 rent discovery"
    query: "site:rent.591.com.tw {districts} {rent_max}以下"
    enabled: true
